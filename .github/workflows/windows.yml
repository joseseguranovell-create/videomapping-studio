name: Windows — pruebas y paquete

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pruebas de extremo a extremo (Electron real)
        run: node tests/e2e/run.mjs
      - name: Instalador y versión portátil
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: videomapping-studio-windows
          path: |
            release/*.exe
            release/*.zip
          retention-days: 30
