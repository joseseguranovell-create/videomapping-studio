name: Windows — pruebas y paquete

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Cada paso guarda su salida en ci-log.txt y su resultado en ci-status.txt.
      # Los pasos siguen aunque falle uno anterior, para obtener el diagnóstico completo.
      - name: Dependencias
        run: |
          set +e +o pipefail
          npm ci 2>&1 | tee -a ci-log.txt; code=${PIPESTATUS[0]}
          echo "npm ci: $code" >> ci-status.txt
      - name: Tipos
        continue-on-error: true
        run: |
          set +e +o pipefail
          npm run typecheck 2>&1 | tee -a ci-log.txt; code=${PIPESTATUS[0]}
          echo "typecheck: $code" >> ci-status.txt
      - name: Pruebas unitarias
        continue-on-error: true
        run: |
          set +e +o pipefail
          npm test 2>&1 | tee -a ci-log.txt; code=${PIPESTATUS[0]}
          echo "unit: $code" >> ci-status.txt
      - name: Compilación
        continue-on-error: true
        run: |
          set +e +o pipefail
          npm run build 2>&1 | tee -a ci-log.txt; code=${PIPESTATUS[0]}
          echo "build: $code" >> ci-status.txt
      - name: Pruebas de extremo a extremo (Electron real)
        continue-on-error: true
        run: |
          set +e +o pipefail
          node tests/e2e/run.mjs 2>&1 | tee -a ci-log.txt; code=${PIPESTATUS[0]}
          echo "e2e: $code" >> ci-status.txt
      - name: Instalador y versión portátil
        continue-on-error: true
        run: |
          set +e +o pipefail
          npx electron-builder --win --x64 --publish never 2>&1 | tee -a ci-log.txt; code=${PIPESTATUS[0]}
          echo "package: $code" >> ci-status.txt
      - name: Arranque del ejecutable empaquetado
        continue-on-error: true
        run: |
          set +e +o pipefail
          node tests/e2e/packaged.mjs "release/win-unpacked/Videomapping Studio.exe" 2>&1 | tee -a ci-log.txt; code=${PIPESTATUS[0]}
          echo "packaged-exe: $code" >> ci-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videomapping-studio-windows
          path: |
            release/*.exe
            release/*.zip
          retention-days: 30
      - name: Publicar la última versión en «Releases»
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "packaged-exe: 0" ci-status.txt; then
            gh release delete ultima --yes --cleanup-tag || true
            gh release create ultima release/*.exe release/*.zip --prerelease --target "$GITHUB_SHA" \
              --title "Última versión (compilada y probada en Windows)" \
              --notes "Compilada en Windows por GitHub Actions a partir de ${GITHUB_SHA::7}. El ejecutable se ha arrancado automáticamente en Windows antes de publicarse. Descarga el instalador (.exe) o la versión portátil (.zip)."
          else
            echo "El ejecutable no arrancó: no se publica."
          fi
      - name: Publicar diagnóstico en la rama ci-logs
        if: always()
        run: |
          cat ci-status.txt || true
          mkdir -p /tmp/out && cp ci-log.txt ci-status.txt /tmp/out/ 2>/dev/null || true
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rfq . || true
          cp /tmp/out/* . && git add ci-log.txt ci-status.txt
          git commit -qm "CI ${GITHUB_SHA::7}" && git push -f origin HEAD:ci-logs
      - name: Resultado
        if: always()
        run: |
          ! grep -E ': [1-9]' ci-status.txt
