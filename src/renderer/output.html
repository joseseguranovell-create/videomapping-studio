<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: vmapp:; media-src 'self' blob: vmapp:; connect-src 'self' vmapp:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Salida de proyección</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #wrap { position: relative; }
      #wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #msg { position: fixed; left: 16px; bottom: 12px; color: #777; font: 13px system-ui, sans-serif; cursor: default; }
      body.calib { cursor: crosshair; }
      body.calib.grab { cursor: grabbing; }
      #hud { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: 92vw; padding: 9px 16px; border-radius: 10px;
        background: rgba(10, 10, 14, 0.82); color: #e8e8ee; font: 14px/1.45 'Segoe UI', system-ui, sans-serif; text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.15); transition: opacity 0.6s; pointer-events: none; }
      #hud b { color: #ffb27a; font-weight: 600; }
      #hud kbd { display: inline-block; padding: 0 6px; margin: 0 2px; border-radius: 4px; background: #2a2b33; border: 1px solid #44464f; font: 12px/18px ui-monospace, Consolas, monospace; }
      #hud.hidden { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="stage"><div id="wrap"><canvas id="gl"></canvas><canvas id="ov"></canvas></div></div>
    <div id="msg"></div>
    <div id="hud" class="hidden"></div>
    <script type="module" src="./output/main.ts"></script>
  </body>
</html>
